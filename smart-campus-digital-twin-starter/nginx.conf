server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /cesium/ {
    try_files $uri =404;
    # Cesium runtime files are version-coupled but not content-hashed.
    # Keep the cache bounded so an upgrade cannot leave stale Workers/Assets behind.
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
