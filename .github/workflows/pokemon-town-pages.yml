name: Deploy Pokemon Town

on:
  push:
    branches: [main]
    paths:
      - 'pokemon-town/**'
      - '.github/workflows/pokemon-town-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pokemon-town-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pokemon-town
      - id: deployment
        uses: actions/deploy-pages@v4
