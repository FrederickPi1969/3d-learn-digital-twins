<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素镇 · 地图探索</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="titlebar">
        <span class="title-pokeball">●</span>
        <div>
          <p class="eyebrow">GB STYLE · MAP DEMO</p>
          <h1>叶风镇</h1>
        </div>
        <button id="reset-button" class="reset-button" type="button">回到广场</button>
      </header>

      <section class="game-frame" aria-label="叶风镇可互动地图">
        <div id="scene" class="scene scene-world">
          <div id="map" class="map" role="application" aria-label="使用方向键或 WASD 移动"></div>
          <div id="player" class="player facing-down" aria-label="玩家"></div>
          <div id="fade" class="fade" aria-hidden="true"></div>
          <div id="toast" class="toast" aria-live="polite">走到门口，就能进入房子。</div>
        </div>
        <div class="hud"><span id="location">叶风镇 · 广场</span><span>方向键 / WASD</span></div>
      </section>

      <section class="controls" aria-label="移动控制">
        <button data-move="up" aria-label="向上移动">▲</button>
        <button data-move="left" aria-label="向左移动">◀</button>
        <button data-move="down" aria-label="向下移动">▼</button>
        <button data-move="right" aria-label="向右移动">▶</button>
      </section>

      <p class="tip">绿色高草、石墙和房屋都不可穿过。踩到任意房门会自动进入，踩到室内门垫即可离开。</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
